<svg xmlns="http://www.w3.org/2000/svg" width="880" height="332" viewBox="0 0 880 332" role="img">

<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .scan { animation: scan 3.2s ease-in-out infinite; }
  @keyframes scan {
    0% { transform: translateY(0); opacity: 0; }
    12% { opacity: .55; }
    88% { opacity: .55; }
    100% { transform: translateY(var(--travel, 220px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scan { animation: none; opacity: 0; }
  }
</style>

<rect width="880" height="332" fill="#e7eaef"/>

      <rect x="16" y="16" width="848" height="300" fill="#ffffff" stroke="#d5d8e0"/>
      <clipPath id="ph"><rect x="36" y="40" width="180" height="240"/></clipPath>
      <image href="data:image/jpeg;base64," x="36" y="40" width="180" height="240" clip-path="url(#ph)" preserveAspectRatio="xMidYMin slice"/>
      <rect x="36" y="40" width="180" height="240" fill="none" stroke="#d5d8e0"/>
      <g style="--travel:236px">
      <rect class="scan" x="36" y="40" width="180" height="2" fill="#9aa1ab"/>
      <rect x="36" y="40" width="180" height="2" fill="#9aa1ab" opacity="0.0">
        <animate attributeName="y" values="40;276;40" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.12;0.88;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
      <text x="250" y="58" fill="#5e6572" font-size="12" letter-spacing="2">SURAKSHA  ·  WHOAMI</text>
      <text x="250" y="92" fill="#1c1f26" font-size="28" font-weight="600">SURAJ KUMAR DAS</text>
      <text x="250" y="118" fill="#5e6572" font-size="11" letter-spacing="1.4">BORN</text><text x="330" y="118" fill="#1c1f26" font-size="14">20.09.2000  ·  08:49 AM</text><text x="250" y="144" fill="#5e6572" font-size="11" letter-spacing="1.4">PLACE</text><text x="330" y="144" fill="#1c1f26" font-size="14">BHOGPUR, PASCHIM MIDNAPUR</text><text x="250" y="170" fill="#5e6572" font-size="11" letter-spacing="1.4">STUDY</text><text x="330" y="170" fill="#1c1f26" font-size="14">M.SC 8.67  ·  B.SC 8.41</text><text x="250" y="196" fill="#5e6572" font-size="11" letter-spacing="1.4">FIELD</text><text x="330" y="196" fill="#1c1f26" font-size="14">HOSPITAL  ·  12 MONTHS</text><text x="250" y="222" fill="#5e6572" font-size="11" letter-spacing="1.4">DIET</text><text x="330" y="222" fill="#1c1f26" font-size="14">PURE VEG (SAKARI)</text><text x="250" y="248" fill="#5e6572" font-size="11" letter-spacing="1.4">NODE</text><text x="330" y="248" fill="#1c1f26" font-size="14">BHGP-721124</text>
      <circle cx="820" cy="48" r="4" fill="#1c1f26">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
