    12% { opacity: .55; }
    88% { opacity: .55; }
    100% { transform: translateY(var(--travel, 220px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scan { animation: none; opacity: 0; }
  }
</style>

