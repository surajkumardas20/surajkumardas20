<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img">

<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .scan { animation: scan 3.2s ease-in-out infinite; }
  @keyframes scan {
    0% { transform: translateY(0); opacity: 0; }
    12% { opacity: .55; }
    88% { opacity: .55; }
    100% { transform: translateY(var(--travel, 220px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scan { animation: none; opacity: 0; }
  }
</style>

<rect width="880" height="200" fill="#e7eaef"/>
<rect x="16" y="12" width="848" height="168" fill="#ffffff" stroke="#d5d8e0"/>
      <text x="36" y="42" fill="#1c1f26" font-size="15" font-weight="600" letter-spacing="1.5">OCCUPATION &amp; INTERESTS</text>
      <text x="844" y="42" fill="#5e6572" font-size="12" text-anchor="end">occupation.dat</text>
      <line x1="28" y1="54" x2="852" y2="54" stroke="#d5d8e0"/>
    
      <text x="36" y="84" fill="#5e6572" font-size="12" letter-spacing="1.2">OCCUPATION</text>
      <text x="250" y="84" fill="#1c1f26" font-size="14">BUSINESS</text>
      <line x1="36" y1="94" x2="844" y2="94" stroke="#d5d8e0" opacity="0.85">
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      </line>
    
      <text x="36" y="116" fill="#5e6572" font-size="12" letter-spacing="1.2">MAIN HOBBIES</text>
      <text x="250" y="116" fill="#1c1f26" font-size="14">PUJA</text>
      <line x1="36" y1="126" x2="844" y2="126" stroke="#d5d8e0" opacity="0.85">
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.6s" begin="0.15s" repeatCount="indefinite"/>
      </line>
    
      <text x="36" y="148" fill="#5e6572" font-size="12" letter-spacing="1.2">ALSO</text>
      <text x="250" y="148" fill="#1c1f26" font-size="14">LISTENING SONGS  ·  SPIRITUAL TOUR</text>
      <line x1="36" y1="158" x2="844" y2="158" stroke="#d5d8e0" opacity="0.85">
        <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.6s" begin="0.3s" repeatCount="indefinite"/>
      </line>
</svg>
