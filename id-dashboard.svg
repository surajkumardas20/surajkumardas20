<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img">

<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .scan { animation: scan 3.2s ease-in-out infinite; }
  @keyframes scan {
    0% { transform: translateY(0); opacity: 0; }
    12% { opacity: .55; }
    88% { opacity: .55; }
    100% { transform: translateY(var(--travel, 220px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scan { animation: none; opacity: 0; }
  }
</style>

